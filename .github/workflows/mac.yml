      - name: test coder dynamic
        run: |
          octave --eval "pkg ('load' ,'coder');octave2oct('unique','mode','dynamic','cache','cache1','verbose',1,'KeepSource',1,'outname','dyunique','CompilerOptions','-v')"

      - name: check dyn .oct file type
        run: |
          otool -hv dyunique.oct   

      - name: test created function
        run: |
          octave --eval "dyunique([4 3 33 3 2 5 3 2])"   

      - name: check coder.dylib file type
        run: |
          otool -hv cache1/bin/libcoder.dylib

      - name: test coder dynamic for repmat
        run: |
          octave --eval "pkg ('load' ,'coder');octave2oct('repmat','mode','dynamic','cache','cache1','verbose',1,'KeepSource',1,'outname','dyrepmat','CompilerOptions','-v')"

      - name: test created function
        run: |
          octave --eval "dyunique([4 3 33 3 2 5 3 2]),dyrepmat(1,5),clear('dyrepmat'),dyunique([4 3 33 3 2 5 3 2]),dyrepmat(1,5)"   
