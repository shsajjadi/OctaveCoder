name: Run Octave on macOS
on: [workflow_dispatch]

jobs:
  octave:
    runs-on: macos-26-intel

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install Octave
        run: |
          brew update
          brew install octave
      
      - name: Export DYLD_LIBRARY_PATH for subsequent steps
        run: |
          echo "DYLD_LIBRARY_PATH=${GITHUB_WORKSPACE}/cache1/bin:${DYLD_LIBRARY_PATH:-}" >> $GITHUB_ENV
      
      - name: Verify Octave
        run: |
          octave --version

      - name: build flags
        run: |
          mkoctfile -p ALL_CXXFLAGS
          mkoctfile -p ALL_LDFLAGS
          mkoctfile -p OCTLIBDIR
          mkoctfile -p LIBOCTAVE
          mkoctfile -p LIBOCTINTERP
          
      - name: Install coder
        run: |
          octave --eval "pkg install https://github.com/shsajjadi/OctaveCoder/archive/refs/heads/dev.tar.gz"

