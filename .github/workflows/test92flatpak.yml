# This is a basic workflow to help you get started with Actions

name: CI  9.2.0 imread flatpak

# Controls when the workflow will run
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Runs a single command using the runners shell
      - name: Install octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install flatpak
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install flathub org.octave.Octave
      
      - name: print octave version
        run: flatpak run org.octave.Octave  --no-gui --eval "version"
              
      - name: Install coder
        run: flatpak run org.octave.Octave  --no-gui --eval "pre_install;"

      - name: copy coder
        run: cp src/octave2oct.oct octave2oct.oct

      - name: compile test
        run: flatpak run org.octave.Octave  --no-gui --eval "octave2oct('randomplot', 'mode', 'static', 'verbose', 1, 'cache', 'cache2')"

      - name: run test
        run: flatpak run org.octave.Octave  --no-gui --eval "randomplot(3, 4)"

      - name: list files
        run: dir

      - name: compile imread
        run: flatpak run org.octave.Octave  --no-gui --eval "octave2oct('imread', 'mode', 'static', 'verbose', 1, 'cache', 'cache2')"
        
      - name: test imread
        run: flatpak run org.octave.Octave  --no-gui --eval "disp(size(imread('caca.jpg')))"        
