# This is a basic workflow to help you get started with Actions

name: CI launch 10.2

# Controls when the workflow will run
on:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  test:
    # The type of runner that the job will run on
    runs-on: windows-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Runs a single command using the runners shell
      - name: Download Octave
        run: Invoke-WebRequest https://ftp.gnu.org/gnu/octave/windows/octave-10.2.0-w64.7z -OutFile octave-10.2.0-w64.7z

      - name: Extract Octave
        run: 7z x octave-10.2.0-w64.7z

      - name: list files
        run: dir

      - name: Create Archive
        run: git archive --format=tar.gz -o coder.tar.gz dev

      - name: Install coder
        run: octave-10.2.0-w64\octave-launch  --no-gui --eval "pkg install coder.tar.gz;"


      - name: compile test
        run: octave-10.2.0-w64\octave-launch  --no-gui --eval "pkg('load', 'coder');octave2oct('randomplot', 'mode', 'static', 'verbose', 1, 'cache', 'cache2')"

      - name: write runrp
        run: Add-Content -Path runrp.m -Value 'function runrp;randomplot(3, 4);end'

      - name: run test
        run: octave-10.2.0-w64\octave-launch  --no-gui --eval "runrp"

      - name: list files
        run: dir
